[package]
name = "nativeblocks_core_sdk"
version = "0.1.0"
edition = "2024"

[lib]
name = "nativeblocks_core_sdk"
# - lib:       used by the uniffi-bindgen binary and Rust unit tests
# - cdylib:    shared library consumed by Android (.so) / Flutter (Dart FFI)
# - staticlib: static library linked into the iOS xcframework
crate-type = ["lib", "cdylib", "staticlib"]

# Binary that drives UniFFI binding generation for Kotlin & Swift.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.31", features = ["cli", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
