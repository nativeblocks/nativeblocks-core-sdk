[bindings.kotlin]
# Subpackage of the host's own package; sealed to `internal` by seal-bindings.sh.
package_name = "io.nativeblocks.runtime.ffi"
# Name JNA loads — must match [lib] name in Cargo.toml (libnativeblocks_runtime.so).
cdylib_name = "nativeblocks_runtime"
generate_immutable_records = true
disable_java_cleaner = true

[bindings.swift]
# Swift module holding the generated bindings, sealed to `package` visibility.
module_name = "NativeblocksRuntimeFFI"
# The lower-level C module (header + modulemap + xcframework). Set explicitly:
# it defaults to "{module_name}FFI", which would read NativeblocksRuntimeFFIFFI.
ffi_module_name = "NativeblocksRuntimeCFFI"
generate_immutable_records = true
