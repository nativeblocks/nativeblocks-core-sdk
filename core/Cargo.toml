[package]
name = "core_runtime"
version = "1.0.0"
edition = "2024"

[lib]
name = "nativeblocks_runtime"
# - lib:       used by the uniffi-bindgen binary
# - cdylib:    shared library consumed by Android (.so)
# - staticlib: archive linked INTO the iOS framework binary, so the host SDK
#              ships as one self-contained xcframework with no separate Rust
#              library for consumers to embed (see build-ios.sh).
crate-type = ["lib", "cdylib", "staticlib"]

# Binary that drives UniFFI binding generation for Kotlin & Swift.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["script-quickjs"]
# In-core JavaScript engine (QuickJS via rquickjs) for remote-driven logic.
script-quickjs = ["dep:rquickjs"]
# rquickjs ships no precompiled bindings for the mobile triples; cross-compiles
# generate them at build time with libclang.
script-quickjs-bindgen = ["script-quickjs", "rquickjs/bindgen"]

[dependencies]
uniffi = { version = "0.31.2", features = ["cli", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = { version = "0.8.17" }
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["sync", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }
rquickjs = { version = "0.12.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# iOS ships a staticlib so the Rust code can be linked INTO the framework binary.
# A static archive is not a link product, so neither of the release profile's
# size settings can be inherited:
#
#   lto    Fat LTO has no root set for a staticlib — nothing "uses" the crate
#          from inside the archive — so it internalizes every #[no_mangle]
#          extern "C" entry point. The .a still builds, still contains the
#          crate's object, and that object has zero global symbols.
#   strip  Removes the symbol table an archive needs; a cdylib survives it only
#          because its exports are recorded separately.
#
# Both are silent: you get a plausible-looking 60 MB .a that resolves nothing.
# Android keeps using [profile.release] — it ships the cdylib, which is a link
# product and therefore unaffected. Nothing here reaches an app either way: the
# consuming linker drops every section it does not reference.
[profile.ios-static]
inherits = "release"
lto = false
strip = false
